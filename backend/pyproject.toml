[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "agno>=3.2.1",
    "fastapi[standard]>=0.165.0",
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "openai>=3.57.0",
    "pgvector>=0.5.1",
    "pre-commit>=4.7.0",
    "prometheus-api-client>=0.7.2",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "python-dotenv>=1.2.4",
    "python-telegram-bot>=22.8",
    "rich>=15.0.0",
    "ruff>=0.17.6",
    "sentence-transformers>=6.3.0",
    "slack-sdk>=3.48.0",
    "sqlalchemy>=2.1.9",
    "greenlet>=3.1.1",
    "structlog>=26.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nightwatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
