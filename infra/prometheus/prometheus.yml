global:
  scrape_interval: 5s
  evaluation_interval: 5s

# Hubungkan Prometheus ke Alertmanager
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Muat file aturan peringatan (alert rules)
rule_files:
  - /etc/prometheus/alert_rules.yml

# Target yang di-scrape metriknya
scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'sample-app'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['sample-app:8000']