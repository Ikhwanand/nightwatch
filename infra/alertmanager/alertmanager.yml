global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'service', 'instance']
  group_wait: 5s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'nightwatch-webhook'

receivers:
  - name: 'nightwatch-webhook'
    webhook_configs:
      # host.docker.internal memungkinkan container Alertmanager mengirim HTTP request 
      # langsung ke Nightwatch backend yang berjalan di host (port 7777)
      - url: 'http://host.docker.internal:7777/api/v1/alerts/webhook'
        send_resolved: true